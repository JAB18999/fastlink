# fastlink

Fastlink 是一个基于 OKX 永续合约行情的量化研究与分析框架，聚焦于：

- 行情数据获取与缓存
- 多周期趋势分析
- 技术指标计算
- 策略信号生成
- 历史胜率统计
- 策略比较与参数优化
- 回测逻辑与交易日志
- GitHub Actions 自动运行
- 可视化 dashboard 报告

