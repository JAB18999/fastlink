## 运行方式

### 安装依赖

```bash
python -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
```

### 运行基础分析

```bash
python scripts/run_analysis.py --symbol SOL-USDT-SWAP --timeframes 5m 15m 30m 1H 2H
```

### 执行组合策略分析

```bash
python scripts/run_analysis.py --symbol SOL-USDT-SWAP --strategy combo --charts
```

### 执行回测

```bash
python scripts/run_analysis.py --symbol SOL-USDT-SWAP --run-backtest --charts
```

### 执行参数优化

```bash
python scripts/run_analysis.py --symbol SOL-USDT-SWAP --optimize
```

### 生成 dashboard

```bash
python scripts/run_analysis.py --symbol SOL-USDT-SWAP --run-backtest --optimize --dashboard --charts
```

## 已支持的高级能力

### 1. 组合策略（双指标 / 多周期共振）

新增 `src/strategy_combo.py`，支持：

- EMA + MACD + RSI + BOLL + DMI 组合判定
- 组合多头/空头开仓、加仓、减仓、平仓
- 多周期 bias 判断

### 2. 更成熟的回测结果画图

新增 `src/charts.py`，支持：

- 权益曲线图：reports/equity_curve.png
- 信号事件叠加图：reports/signal_overlay.png

### 3. 完整 HTML 报告

`src/reporter.py` 支持输出：

- reports/analysis_report.html
- 包含市场状态、胜率、回测总结等信息

### 4. SQLite 数据库存储

新增 `src/storage.py`，支持：

- 保存分析运行记录：`data/fastlink.db`
- 保存策略回测记录
- 查询最近的历史分析与回测记录

## 其他模块说明

### 交易日志

保存到 `logs/trades.jsonl`，用于后续分析和复盘。

### 组合策略和参数优化

- `strategy combo` 可对多周期共振策略进行观察
- `--optimize` 可搜索该策略的最优参数组合并持久化

## 说明

这个版本已经进一步接近“实战研究型量化系统”，适合：

- 策略迭代和验证
- 参数搜索和回测
- 结果可视化
- 数据持久化查询
